<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Slash — 2 Hand Gesture</title><link rel="stylesheet" href="style.css"></head><body><canvas id="handOverlay"></canvas>
<video id="camera" autoplay playsinline muted></video><canvas id="overlay"></canvas><section class="panel" id="panel"><h1>HAND SLASH</h1><p>2-hand tracking is enabled. Point + move to Dismantle, fist to recharge, open palm for RCT, and show both hands for Domain Expansion.</p><div class="buttons"><button id="start">Start Camera</button><button id="test">Test Slash</button><button id="hide">Hide</button></div><label>Gesture<select disabled><option>2-Hand Tracking</option></select></label><label class="sensitivity-label">Slash sensitivity <span id="sensitivityValue">62px</span><input id="sensitivity" type="range" min="35" max="110" value="62" step="1"></label><div id="status">Camera off</div><div id="handsText">HANDS 0</div></section><section class="hud"><div>HANDS <b id="handCount">0</b></div><div>COMBO <b id="combo">0</b></div><div>HP <span class="bar hp"><i id="hp"></i></span></div><div>ENERGY <span class="bar"><i id="energy"></i></span></div></section><button class="show" id="show">☰</button><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script src="app.js?v=35"></script>
<div id="domain-overlay" class="domain-overlay" aria-hidden="true">
  <div class="domain-aura"></div>
  <div class="domain-title">DOMAIN EXPANSION</div>
  <div class="domain-subtitle">MALEVOLENT SHRINE</div>
</div>

<div id="slashLayer"></div><div id="domainFx" class="domain-overlay"></div><div id="rctFx"></div>
</body></html>
