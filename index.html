<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand Slash — Single Clean Dismantle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<section class="panel" id="panel">
  <h1>HAND SLASH</h1>
  <p>Point + move your index finger to launch one clean Dismantle slash.</p>
  <div class="buttons">
    <button id="start">Start Camera</button>
    <button id="test">Test Slash</button>
    <button id="hide">Hide</button>
  </div>
  <label>Gesture
    <select id="gesture">
      <option>Point + Move</option>
    </select>
  </label>
  <label>Sensitivity
    <input id="sensitivity" type="range" min="0.5" max="2" step="0.05" value="1">
  </label>
  <div id="status">Camera off</div>
</section>

<section class="hud">
  <div>COMBO <b id="combo">0</b></div>
  <div>ENERGY <span class="bar"><i id="energy"></i></span></div>
</section>

<script src="app.js"></script>
</body>
</html>
