<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Slash — 2 Hand Gesture</title><link rel="stylesheet" href="style.css"></head><body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="handOverlay"></canvas>
<canvas id="effectCanvas"></canvas>

<section class="panel" id="panel">
  <h1>HAND SLASH</h1>
  <p>☝️ Point + swipe = Dismantle • ✊ Fist = recharge • 🖐️ RCT • 👐 Domain Expansion</p>
  <div class="buttons">
    <button id="start">Start Camera</button>
    <button id="test">Test Slash</button>
    <button id="hide">Hide</button>
  </div>
  <label>Slash sensitivity <span id="sensitivityValue">75px</span>
    <input id="sensitivity" type="range" min="45" max="120" value="75" step="1">
  </label>
  <div id="status">Camera off</div>
  <div id="handsText">HANDS 0</div>
</section>

<section class="hud">
  <div>HANDS <b id="handCount">0</b></div>
  <div>COMBO <b id="combo">0</b></div>
  <div>HP <span class="bar hp"><i id="hpBar"></i></span> <span id="hpText">70 / 100</span></div>
  <div>ENERGY <span class="bar"><i id="energyBar"></i></span> <span id="energyText">300 / 300</span></div>
</section>

<div id="domainFx" class="domain-overlay" aria-hidden="true"></div>
<div id="rctFx" aria-hidden="true"></div>
<img id="rechargeFx" src="energy-recovery.webp" alt="" aria-hidden="true">

<script type="module" src="app.js?v=39"></script>
</body></html>
